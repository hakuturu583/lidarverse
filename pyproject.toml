# `uv sync` installs everything: inference, data preparation, training and the
# carla_canvas backend. Every dependency is a PyPI wheel; PyPI's torch 2.8 is
# built for CUDA 12.8, which covers Blackwell (RTX PRO 6000, sm_120) as well as
# Ampere/Ada/Hopper. Transformer Engine, NATTEN and Apex are optional: without
# them the networks use the PyTorch implementations in utils/compat.py.

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lidarverse"
version = "0.1.0"
description = "LidarVerse: a real-time unified LiDAR world model across tasks and sensors"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "attrs==25.1.0",
    "av==16.1.0",
    "boto3==1.35.99",
    "decord==0.6.0; platform_machine == 'x86_64'",
    "diffusers==0.32.2",
    "einops==0.8.1",
    "huggingface-hub==0.29.2",
    "hydra-core==1.3.2",
    "imageio==2.37.0",
    "imageio-ffmpeg==0.6.0",
    "iopath==0.1.10",
    "loguru==0.7.2",
    "lru-dict==1.3.0",
    "matplotlib==3.10.0",
    "mediapy==1.2.2",
    "numpy==1.26.4",
    "nvidia-ml-py==12.535.133",
    "omegaconf==2.3.0",
    "opencv-python-headless==4.11.0.86",
    "pillow==11.1.0",
    "pyyaml==6.0.2",
    "requests==2.32.3",
    "scikit-image==0.25.2",
    "scipy==1.15.1",
    "termcolor==2.5.0",
    "tqdm==4.67.1",
    "wandb>=0.24",  # protobuf 7 (carla-canvas's gRPC stubs)
    "webdataset==0.2.111",
    # Training/diffusion runtime (docs/setup.md).
    "megatron-core==0.10.0",
    "packaging==24.2",
    "pydantic==2.10.6",
    "importlib-metadata==8.6.1",
    "psutil==6.0.0",
    "tensorstore==0.1.45",
    # carla_canvas backend (lidarverse_canvas): the renderer SDK, and OpenDRIVE
    # to RDS-HQ vector layers (roadgen >= 0.37 has the RDS-HQ exporter).
    "carla-canvas>=0.2.0",
    "roadgen>=0.37.0",
]

[project.optional-dependencies]
# Fused kernels; built from source against the installed torch (CUDA toolkit
# with nvcc and cuDNN headers needed): uv sync --extra te
te = ["transformer-engine[pytorch]>=2.4"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["diffusion", "tokenizer", "utils", "lidarverse_canvas"]

[tool.uv]
# The CUDA stack is Linux-only.
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
# megatron-core declares its own test and quantization stacks as runtime
# requirements; docs/setup.md installs it with --no-deps for the same reason.
override-dependencies = [
    "nvidia-modelopt; sys_platform == 'never'",
    "flask-restful; sys_platform == 'never'",
    "nltk; sys_platform == 'never'",
    "pytest-cov; sys_platform == 'never'",
    "pytest-mock; sys_platform == 'never'",
    "pytest-random-order; sys_platform == 'never'",
    "sentencepiece; sys_platform == 'never'",
    "tiktoken; sys_platform == 'never'",
    "zarr; sys_platform == 'never'",
]
no-build-isolation-package = ["transformer-engine-torch"]

[tool.uv.extra-build-dependencies]
transformer-engine-torch = [{ requirement = "torch", match-runtime = true }]

[tool.pytest.ini_options]
testpaths = ["tests", "scripts/validation"]
python_files = ["test_*.py"]
