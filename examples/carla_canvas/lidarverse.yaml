# CARLA's ray-cast LiDARs generated by LidarVerse (Stage 3, HDMap-conditioned),
# through carla_canvas. Start the renderer in this repository's environment:
#   uv run carla-canvas serve --config examples/carla_canvas/lidarverse.yaml
# then run the typesafe_carla program, unchanged, with the same file:
#   CARLA_CANVAS_CONFIG=examples/carla_canvas/lidarverse.yaml typesafe-codon run main.py
renderer:
  backend: lidarverse_canvas:LidarverseRenderer
  endpoint: "localhost:50051"
  startup_timeout: 600          # LoadWorld: reads the map, loads the model, compiles kernels
  timeout: 60                   # per render call (one block of four sweeps every 0.4 s)
  options:
    checkpoints: ../../checkpoints   # scripts/download_checkpoints.py, relative to this file
    stage: 3                    # 3: SF-DMD (4 steps); 2: causal (35 steps)
    num_steps: 4
    seed: 0
    actors: ["vehicle.*", "walker.pedestrian.*"]
    bbox_dilation: 3            # box edges widened to 3x3 range pixels, as the quickstart
    # hdmap: {rdshq: path/to/rds_hq, clip: <clip id>}   # instead of the map's OpenDRIVE
    # map_offset: [0.0, 0.0, 0.0]                       # added to the map (right-handed frame)
sensors:
  - sensor.lidar.ray_cast
ros:
  backend: auto
